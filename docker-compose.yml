# Local Postgres for development and integration tests (`npm run db:up`).
#
# The app talks to Postgres only through Neon's WebSocket Pool driver (D-07), so
# a plain Postgres needs Neon's wsproxy in front of it. Point NEON_WS_PROXY at
# the proxy (localhost:5498/v1); see .env.example. CI runs the same pair as
# service containers (.github/workflows/ci.yml).
#
# Already running a Postgres on 5499? Start only the proxy and aim it there:
#   WSPROXY_TARGET=host.docker.internal:5499 docker compose up -d --no-deps wsproxy
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurant_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5499}:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d restaurant_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  wsproxy:
    # Pinned by digest: the image only publishes `latest`.
    image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
    environment:
      # Every WebSocket connection is forwarded to this host:port.
      APPEND_PORT: "${WSPROXY_TARGET:-postgres:5432}"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "127.0.0.1:${WSPROXY_PORT:-5498}:80"
    depends_on:
      - postgres

volumes:
  pgdata:
